<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the Palazzetti integration talks to your stove</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="540" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Gladys -->
  <rect x="40" y="40" width="230" height="120" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="155" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#0a3069">Gladys</text>
  <text x="155" y="102" text-anchor="middle" font-size="12" fill="#24292f">dashboard, scenes, history</text>
  <text x="155" y="122" text-anchor="middle" font-size="12" fill="#24292f">+ sends the discovery probe</text>
  <text x="155" y="142" text-anchor="middle" font-size="12" fill="#24292f">from the host network (UDP 54549)</text>

  <!-- Integration -->
  <rect x="390" y="40" width="250" height="120" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="515" y="78" text-anchor="middle" font-size="16" font-weight="600" fill="#6b4600">Palazzetti integration</text>
  <text x="515" y="102" text-anchor="middle" font-size="12" fill="#24292f">its own container,</text>
  <text x="515" y="122" text-anchor="middle" font-size="12" fill="#24292f">ONE request at a time per box,</text>
  <text x="515" y="142" text-anchor="middle" font-size="12" fill="#24292f">reads each stove on a loop</text>

  <!-- Gladys <-> integration -->
  <line x1="270" y1="100" x2="388" y2="100" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="329" y="88" text-anchor="middle" font-size="11" fill="#57606a">WebSocket</text>
  <text x="329" y="118" text-anchor="middle" font-size="11" fill="#57606a">+ host API</text>

  <!-- Legend -->
  <line x1="680" y1="56" x2="720" y2="56" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="728" y="60" font-size="12" fill="#24292f">reads (GET …)</text>
  <line x1="680" y1="84" x2="720" y2="84" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="728" y="88" font-size="12" fill="#24292f">commands (SET …)</text>
  <line x1="680" y1="112" x2="720" y2="112" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="728" y="116" font-size="12" fill="#24292f">discovery</text>

  <!-- Cloud, not used -->
  <rect x="680" y="138" width="170" height="54" rx="10" fill="#ffffff" stroke="#8c959f" stroke-dasharray="4 3"/>
  <text x="765" y="161" text-anchor="middle" font-size="13" fill="#8c959f">Palazzetti cloud</text>
  <text x="765" y="180" text-anchor="middle" font-size="11" fill="#cf222e">not used, no account</text>
  <line x1="690" y1="146" x2="840" y2="184" stroke="#cf222e" stroke-width="1.5"/>

  <!-- LAN band -->
  <rect x="20" y="220" width="840" height="300" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 5"/>
  <text x="40" y="505" font-size="12" font-weight="600" fill="#57606a">YOUR LOCAL NETWORK — nothing leaves the house</text>

  <!-- Read loop -->
  <rect x="40" y="290" width="240" height="160" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="160" y="318" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">Read loop</text>
  <text x="58" y="346" font-size="12" fill="#24292f">• GET ALLS every 30 s (setting)</text>
  <text x="58" y="368" font-size="12" fill="#24292f">• GET CNTR every 10 min</text>
  <text x="58" y="390" font-size="12" fill="#24292f">• GET STDT once a day</text>
  <text x="58" y="412" font-size="12" fill="#24292f">• again 12 s after a command</text>
  <text x="58" y="434" font-size="11" fill="#57606a">the box pushes nothing</text>

  <!-- Connection Box -->
  <rect x="330" y="290" width="250" height="160" rx="10" fill="#ffffff" stroke="#cc1317" stroke-width="1.5"/>
  <text x="455" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Connection Box</text>
  <text x="455" y="340" text-anchor="middle" font-size="12" fill="#57606a">(or WPalaControl)</text>
  <text x="350" y="368" font-size="12" fill="#24292f">• HTTP on port 80,</text>
  <text x="362" y="386" font-size="12" fill="#24292f">/cgi-bin/sendmsg.lua?cmd=…</text>
  <text x="350" y="408" font-size="12" fill="#24292f">• OK only if SUCCESS and</text>
  <text x="362" y="426" font-size="12" fill="#24292f">INFO.RSP = "OK"</text>

  <!-- Stove -->
  <rect x="640" y="290" width="200" height="160" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <circle cx="668" cy="318" r="9" fill="#cc1317"/>
  <text x="750" y="322" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Pellet stove</text>
  <text x="660" y="352" font-size="12" fill="#24292f">• status, alarms</text>
  <text x="660" y="372" font-size="12" fill="#24292f">• probes, setpoint</text>
  <text x="660" y="392" font-size="12" fill="#24292f">• power, fans</text>
  <text x="660" y="412" font-size="12" fill="#24292f">• pellet counter</text>

  <!-- Box <-> stove -->
  <line x1="582" y1="370" x2="638" y2="370" stroke="#24292f" stroke-width="2" stroke-dasharray="2 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="610" y="358" text-anchor="middle" font-size="10" fill="#57606a">serial</text>
  <text x="610" y="390" text-anchor="middle" font-size="10" fill="#57606a">slow</text>

  <!-- Reads and commands (integration <-> box) -->
  <path d="M 470 288 L 490 163" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 540 163 L 520 288" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="560" y="240" font-size="11" fill="#57606a">one queue per box:</text>
  <text x="560" y="256" font-size="11" fill="#57606a">overlapping requests crash it</text>

  <!-- Discovery (Gladys <-> box) -->
  <path d="M 250 163 C 280 230, 320 250, 352 288" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="300" y="214" text-anchor="end" font-size="11" fill="#57606a">"plzbridge?" → static data</text>
</svg>

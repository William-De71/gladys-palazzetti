<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>What happens when you change the setpoint</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Lanes -->
  <rect x="70" y="30" width="160" height="44" rx="8" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="150" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#0a3069">Gladys</text>
  <rect x="360" y="30" width="160" height="44" rx="8" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="440" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#6b4600">Integration</text>
  <rect x="650" y="30" width="160" height="44" rx="8" fill="#ffffff" stroke="#cc1317" stroke-width="1.5"/>
  <text x="730" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Connection Box</text>
  <line x1="150" y1="74" x2="150" y2="350" stroke="#d0d7de" stroke-width="2"/>
  <line x1="440" y1="74" x2="440" y2="350" stroke="#d0d7de" stroke-width="2"/>
  <line x1="730" y1="74" x2="730" y2="350" stroke="#d0d7de" stroke-width="2"/>

  <!-- 1. Gladys -> integration -->
  <line x1="150" y1="110" x2="436" y2="110" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="295" y="102" text-anchor="middle" font-size="12" fill="#24292f">setpoint = 21.4 °C</text>

  <!-- 2. Check -->
  <rect x="455" y="124" width="190" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="550" y="140" text-anchor="middle" font-size="11" fill="#24292f">rounded to the degree,</text>
  <text x="550" y="156" text-anchor="middle" font-size="11" fill="#24292f">kept in the stove's range</text>

  <!-- 3. Integration -> box -->
  <line x1="440" y1="190" x2="726" y2="190" stroke="#8250df" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="585" y="182" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#24292f">SET SETP 21</text>

  <!-- 4. Answer -->
  <line x1="730" y1="225" x2="444" y2="225" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="585" y="217" text-anchor="middle" font-size="12" fill="#24292f">answer carries the new value</text>

  <!-- 5. Published -->
  <line x1="440" y1="260" x2="154" y2="260" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="295" y="252" text-anchor="middle" font-size="12" fill="#24292f">state published at once</text>

  <!-- 6. Re-read -->
  <line x1="440" y1="305" x2="726" y2="305" stroke="#1a7f37" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="585" y="297" text-anchor="middle" font-size="12" fill="#24292f">+12 s: GET ALLS</text>
  <text x="585" y="323" text-anchor="middle" font-size="11" fill="#57606a">the box takes ~10 s to show the effect</text>

  <!-- Refusal -->
  <rect x="40" y="370" width="800" height="78" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="60" y="396" font-size="13" font-weight="600" fill="#a40e26">Refused before anything is sent</text>
  <text x="60" y="418" font-size="12" fill="#24292f">On/off during an ignition, a fire stop or an alarm, a fan speed the model does not offer, no remote on/off on wood stoves:</text>
  <text x="60" y="436" font-size="12" fill="#24292f">the integration answers Gladys with the reason, translated — e.g. “Living room cannot be switched right now (Heating up)”.</text>
</svg>

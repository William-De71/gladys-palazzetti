<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The phases of the stove, behind the "state changed" trigger</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="440" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="40" font-size="15" font-weight="600" fill="#24292f">About twenty status codes (LSTATUS), seven phases for the scenes</text>
  <text x="40" y="60" font-size="12" fill="#57606a">A trigger fires when the phase changes; the detailed status stays available as a variable.</text>

  <!-- Off -->
  <rect x="40" y="90" width="160" height="90" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="120" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Off</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#57606a">0, 1, 501, 505</text>
  <text x="120" y="162" text-anchor="middle" font-size="11" fill="#1a7f37">⏻ on accepted</text>

  <!-- Ignition -->
  <rect x="250" y="90" width="160" height="90" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="330" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#6b4600">Ignition</text>
  <text x="330" y="140" text-anchor="middle" font-size="11" fill="#57606a">2–5, 502, 503</text>
  <text x="330" y="162" text-anchor="middle" font-size="11" fill="#cf222e">⏻ refused</text>

  <!-- Heating -->
  <rect x="460" y="90" width="160" height="90" rx="10" fill="#fff1e5" stroke="#cc1317" stroke-width="1.5"/>
  <text x="540" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#a40e26">Heating</text>
  <text x="540" y="140" text-anchor="middle" font-size="11" fill="#57606a">6, 7, 11, 504</text>
  <text x="540" y="162" text-anchor="middle" font-size="11" fill="#1a7f37">⏻ off accepted</text>

  <!-- Eco -->
  <rect x="680" y="90" width="160" height="90" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="760" y="118" text-anchor="middle" font-size="15" font-weight="600" fill="#116329">Eco standby</text>
  <text x="760" y="140" text-anchor="middle" font-size="11" fill="#57606a">51 — room warm enough</text>
  <text x="760" y="162" text-anchor="middle" font-size="11" fill="#1a7f37">⏻ off accepted</text>

  <!-- Cooling -->
  <rect x="460" y="230" width="160" height="90" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="540" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#0a3069">Shutting down</text>
  <text x="540" y="280" text-anchor="middle" font-size="11" fill="#57606a">9, 10, 12, 506</text>
  <text x="540" y="302" text-anchor="middle" font-size="11" fill="#57606a">⏻ refused during 10</text>

  <!-- Cleaning -->
  <rect x="250" y="230" width="160" height="90" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="330" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Final cleaning</text>
  <text x="330" y="280" text-anchor="middle" font-size="11" fill="#57606a">50, 507</text>
  <text x="330" y="302" text-anchor="middle" font-size="11" fill="#cf222e">⏻ refused</text>

  <!-- Alarm -->
  <rect x="680" y="230" width="160" height="90" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="760" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#a40e26">Alarm</text>
  <text x="760" y="280" text-anchor="middle" font-size="11" fill="#57606a">1xxx, from any phase</text>
  <text x="760" y="302" text-anchor="middle" font-size="11" fill="#cf222e">acknowledged on the stove</text>

  <!-- Transitions -->
  <line x1="200" y1="135" x2="248" y2="135" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="135" x2="458" y2="135" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="125" x2="678" y2="125" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="678" y1="148" x2="620" y2="148" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="180" x2="540" y2="228" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="275" x2="412" y2="275" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 250 275 L 120 275 L 120 182" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="180" x2="760" y2="228" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>

  <!-- Notes -->
  <rect x="40" y="345" width="800" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="370" font-size="12" fill="#24292f">• Status 11, the periodic brazier cleaning while burning, stays “Heating”: no trigger every few hours.</text>
  <text x="58" y="392" font-size="12" fill="#24292f">• The “Alarm” trigger filters on the family: no pellets, door open, overheat, flue, chimney cleaning, probe, fuel, other.</text>
</svg>
